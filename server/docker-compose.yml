version: "3.9"

services:
  backend:
    build: ./backend
    container_name: control-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

    environment:
      CORS_ORIGINS: http://localhost:8080
      PORT: 8000

      EVENT_TYPE: file.ready
      EVENT_POLL_INTERVAL_SEC: "1.0"
      STATUS_POLL_INTERVAL_SEC: "15.0"
    # volumes:
    #   - ./backend/incoming:/app/incoming
    #   - ./backend/served:/app/served

  frontend:
    build: ./frontend
    container_name: control-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
