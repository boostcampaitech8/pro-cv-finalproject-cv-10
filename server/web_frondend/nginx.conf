server {
  listen 80;
  root /usr/share/nginx/html;

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    expires -1;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }


  location / {
    try_files $uri $uri/ /index.html;
  }
}
